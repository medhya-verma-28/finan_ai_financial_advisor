<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F₹nan AI - Financial Advisor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prata&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Falling ₹ background -->
    <div id="rupeeFall" aria-hidden="true"></div>

    <!-- Fixed top-right Sign In button (shown only when logged out) -->
    <button id="homeSignInBtn" class="home-signin-top" onclick="signInGoogle()">
        <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.[...]
        Sign In
    </button>

    <!-- ===== LOGGED-OUT HOME ===== -->
    <div id="homeScreen">
        <header class="home-header">
            <div class="logo-block">
                <div class="logo-row">
                    <div class="cash-bundle left-bundle">
                        <span class="note">💵</span><span class="note">💵</span><span class="note">💵</span>
                    </div>
                    <h1 class="logo-text">F₹nan</h1>
                    <div class="cash-bundle right-bundle">
                        <span class="note">💵</span><span class="note">💵</span><span class="note">💵</span>
                    </div>
                </div>
                <p class="logo-sub">AI FINANCIAL ADVISOR <span class="for-india">FOR INDIA</span></p>
            </div>
        </header>

        <main class="home-main">
            <!-- Guest chat section -->
            <section class="chat-section" id="guestChat">
                <div class="chat-messages" id="guestMessages">
                    <div class="msg finan-msg">
                        <span class="msg-avatar">F₹</span>
                        <div class="msg-bubble">
                            Hello! I'm <strong>Finan</strong>, your AI financial advisor built for India. Tell me about your income, expenses and debt — I'll give you personalised advice.<br><br[...]
                            <em>Sign in with Google to save your budgets and chat history.</em>
                            <br>
                            <button class="example-prompt-btn" onclick="fillExample()">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" [...]Try an example prompt
                            </button>
                        </div>
                    </div>
                </div>
                <div class="chat-input-row">
                    <textarea id="guestInput" placeholder="Describe your financial situation… e.g. I earn ₹80,000/month in Mumbai, rent is ₹22,000…" rows="2"></textarea>
                    <button id="guestSendBtn" onclick="guestSend()">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2=[...]
                    </button>
                </div>
            </section>

        </main>
    </div>

    <!-- ===== LOGGED-IN DASHBOARD ===== -->
    <div id="dashboard" class="hidden">
        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-logo">F₹nan</div>
            <button class="sidebar-btn active" id="newChatBtn" onclick="startNewChat()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2=[...]
                New Chat
            </button>

            <div class="sidebar-section-label">
                Recent Chats
                <button class="sidebar-section-action" onclick="clearAllChats()" title="Clear all chats">Clear all</button>
            </div>
            <div id="recentChatsList" class="sidebar-chats"></div>

            <div class="sidebar-section-label">Saved Budgets</div>
            <button class="sidebar-btn" onclick="showBudgets()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" hei[...]
                My Saved Budgets
            </button>

            <div class="sidebar-spacer"></div>

            <div class="sidebar-profile">
                <img id="sidebarAvatar" src="" alt="Profile" class="avatar-img">
                <div class="profile-info">
                    <span id="sidebarName" class="profile-name"></span>
                    <span id="sidebarEmail" class="profile-email"></span>
                </div>
            </div>
            <button class="sidebar-btn signout-btn" onclick="signOutUser()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a[...]
                Sign Out
            </button>
        </aside>

        <!-- Main chat area -->
        <div class="dash-main">
            <div class="dash-topbar">
                <button class="hamburger" onclick="toggleSidebar()">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/>[...]
                </button>
                <span class="dash-title">F₹nan AI</span>
                <img id="topbarAvatar" src="" alt="" class="avatar-img small">
            </div>

            <!-- Chat messages -->
            <div class="chat-messages dash-messages" id="dashMessages">
                <div class="msg finan-msg">
                    <span class="msg-avatar">F₹</span>
                    <div class="msg-bubble">
                        Welcome back! I'm <strong>Finan</strong>, your personal AI financial advisor. Tell me about your finances and I'll provide personalised advice, and save your suggested bud[...]
                    </div>
                </div>
            </div>

            <!-- Budget panel (hidden by default) -->
            <div id="budgetPanel" class="budget-panel hidden">
                <div class="budget-panel-header">
                    <h3>My Saved Budgets</h3>
                    <div class="budget-panel-actions">
                        <button class="budget-action-btn" onclick="exportBudgetsCSV()" title="Download as CSV">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2[...]
                            Export CSV
                        </button>
                        <button class="budget-action-btn danger" onclick="clearAllBudgets()" title="Delete all budgets">Clear all</button>
                        <button onclick="closeBudgets()" style="background:transparent;border:none;color:var(--text-dim);font-size:1.1rem;cursor:pointer;">✕</button>
                    </div>
                </div>
                <div id="budgetTableWrap"></div>
            </div>

            <div class="chat-input-row dash-input">
                <textarea id="dashInput" placeholder="Ask Finan about your finances…" rows="2"></textarea>
                <button id="dashSendBtn" onclick="dashSend()">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11[...]
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut }
            from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, writeBatch }
            from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "{{ firebase_api_key }}",
            authDomain: "{{ firebase_project_id }}.firebaseapp.com",
            projectId: "{{ firebase_project_id }}",
            storageBucket: "{{ firebase_project_id }}.firebasestorage.app",
            appId: "{{ firebase_app_id }}",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const db = getFirestore(app);

        // Expose to global scope for button handlers
        window._fbAuth = auth;
        window._fbProvider = provider;
        window._fbSignOut = signOut;
        window._db = db;
        window._fsCollection = collection;
        window._fsAddDoc = addDoc;
        window._fsGetDocs = getDocs;
        window._fsDeleteDoc = deleteDoc;
        window._fsDoc = doc;
        window._fsQuery = query;
        window._fsOrderBy = orderBy;
        window._fsWriteBatch = writeBatch;

        onAuthStateChanged(auth, (user) => {
            const signInBtn = document.getElementById('homeSignInBtn');
            if (user) {
                window._currentUser = user;
                document.getElementById('homeScreen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('sidebarAvatar').src = user.photoURL || '';
                document.getElementById('topbarAvatar').src = user.photoURL || '';
                document.getElementById('sidebarName').textContent = user.displayName || '';
                document.getElementById('sidebarEmail').textContent = user.email || '';
                if (signInBtn) signInBtn.style.display = 'none';
                loadRecentChats();
            } else {
                window._currentUser = null;
                document.getElementById('homeScreen').classList.remove('hidden');
                document.getElementById('dashboard').classList.add('hidden');
                if (signInBtn) signInBtn.style.display = 'flex';
            }
        });

        // Load app.js only after Firebase globals are exposed
        const appScript = document.createElement('script');
        appScript.src = '/app.js';
        document.body.appendChild(appScript);
    </script>
</body>
</html>
